title: "Jerry's Engineering Lab"
description: Thinking, Building & Learning — tech writing, essays and photography.
url: https://kaetowjj.github.io
baseurl: ""
default_language: en
lang: en
timezone: Asia/Shanghai
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  parse_block_html: true
collections:
  tech:
    output: true
    permalink: /tech/:name/
  essays:
    output: true
    permalink: /essays/:name/
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: tech
    values:
      layout: article
      nav: tech
  - scope:
      path: ""
      type: essays
    values:
      layout: article
plugins:
  - jekyll-sitemap
exclude: [README.md, AGENTS.md, Gemfile, Gemfile.lock, node_modules, package.json, package-lock.json, scripts, tests, playwright.config.mjs, test-results, playwright-report, docs, originals, vendor]
