headline:
  en: Still branching out.
  zh: 还在探索。
intro:
  en: I'm Jerry. I enjoy figuring out how technology works, but I'm just as curious
    about the world beyond the screen. These days, I'm exploring how to make AI genuinely
    useful, photographing wildlife and everyday life, and learning to put my own thoughts
    into words.
  zh: 我是 Jerry。我喜欢琢磨技术背后的原理，也喜欢走出屏幕，用相机观察自然和身边的生活。最近在探索怎样让 AI 真正派上用场，也在慢慢学习如何更好地表达自己的观察和想法。
